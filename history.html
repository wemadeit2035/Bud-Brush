<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Archive</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #f4f6fb;
        font-family: Arial, sans-serif;
      }
      .card {
        border: none;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      }
      .archive-item {
        border: 1px solid #e7ebf3;
        border-radius: 14px;
        padding: 1rem;
        margin-bottom: 0.8rem;
        background: white;
      }
      .archive-item h6 {
        margin-bottom: 0.2rem;
      }
      .archive-sales {
        margin-top: 0.8rem;
        border-top: 1px solid #eef2f7;
        padding-top: 0.8rem;
      }
      @media (max-width: 576px) {
        .archive-item .d-flex {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-1">Bud & Brush archive</h2>
          <p class="text-muted mb-0">
            Browse past contribution days saved locally.
          </p>
        </div>
        <a href="index.html" class="btn btn-outline-secondary">Back to home</a>
      </div>

      <div class="card p-3">
        <div id="archiveList" class="list-group"></div>
      </div>
    </div>

    <script>
      const DB_NAME = "salesInventoryDB";
      const STORE_NAME = "dailyArchives";

      function openArchiveDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME);

          request.onupgradeneeded = (event) => {
            const db = event.target.result;

            if (!db.objectStoreNames.contains(STORE_NAME)) {
              const store = db.createObjectStore(STORE_NAME, {
                keyPath: "date",
              });

              store.createIndex("dateIndex", "date", { unique: true });
            }
          };

          request.onsuccess = async () => {
            const db = request.result;

            if (!db.objectStoreNames.contains(STORE_NAME)) {
              const nextVersion = db.version + 1;
              db.close();

              const upgradeRequest = indexedDB.open(DB_NAME, nextVersion);

              upgradeRequest.onupgradeneeded = (event) => {
                const upgradedDb = event.target.result;

                if (!upgradedDb.objectStoreNames.contains(STORE_NAME)) {
                  const store = upgradedDb.createObjectStore(STORE_NAME, {
                    keyPath: "date",
                  });

                  store.createIndex("dateIndex", "date", { unique: true });
                }
              };

              upgradeRequest.onsuccess = () => resolve(upgradeRequest.result);
              upgradeRequest.onerror = () =>
                reject(
                  upgradeRequest.error ||
                    new Error("Unable to upgrade archive DB."),
                );
            } else {
              resolve(db);
            }
          };

          request.onerror = () =>
            reject(request.error || new Error("Unable to open archive DB."));
        });
      }

      async function loadArchives() {
        const db = await openArchiveDB();
        const transaction = db.transaction(STORE_NAME, "readonly");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.getAll();

        return new Promise((resolve, reject) => {
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () =>
            reject(request.error || new Error("Unable to load archives."));
        });
      }

      async function renderArchives() {
        const container = document.getElementById("archiveList");
        try {
          const archives = await loadArchives();

          if (!archives.length) {
            container.innerHTML =
              '<div class="alert alert-light mb-0">No archived days yet.</div>';
            return;
          }

          container.innerHTML = archives
            .sort((a, b) => b.date.localeCompare(a.date))
            .map((entry) => {
              const salesRows = (entry.sales || [])
                .map((sale) => {
                  return `
                    <tr>
                      <td>${sale.productName || "Unknown"}</td>
                      <td>${sale.quantity || 0}</td>
                      <td>${sale.payment || "-"}</td>
                      <td>${Number(sale.total || 0).toFixed(2)}</td>
                    </tr>
                  `;
                })
                .join("");

              return `
                <div class="archive-item">
                  <div class="d-flex justify-content-between align-items-start gap-3">
                    <div>
                      <h6 class="mb-1">${entry.date}</h6>
                      <div class="text-muted small">
                        Contributions: ${entry.salesCount} · Total: ${Number(entry.totalRevenue || 0).toFixed(2)}
                      </div>
                    </div>
                    <div class="text-end small text-muted">
                      Cash: ${Number(entry.cashRevenue || 0).toFixed(2)}<br>
                      Yoco: ${Number(entry.yocoRevenue || 0).toFixed(2)}<br>
                      EFT: ${Number(entry.eftRevenue || 0).toFixed(2)}
                    </div>
                  </div>

                  <div class="archive-sales">
                    <div class="table-responsive">
                      <table class="table table-sm align-middle mb-0">
                        <thead class="table-light">
                          <tr>
                            <th>Item</th>
                            <th>Qty</th>
                            <th>Donation</th>
                            <th>Total</th>
                          </tr>
                        </thead>
                        <tbody>${salesRows}</tbody>
                      </table>
                    </div>
                  </div>
                </div>
              `;
            })
            .join("");
        } catch (error) {
          console.error(error);
          container.innerHTML =
            '<div class="alert alert-danger mb-0">Unable to load archive.</div>';
        }
      }

      renderArchives();
    </script>
  </body>
</html>
